name: CI / Deploy

on:
  push:
    branches: ["main"]
    paths:
      - "frontend/**"
      - "infra/**"
      - "backend/**"

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ca-central-1
  PROJECT_NAME: hqmemes
  ENVIRONMENT: prod

jobs:
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'
            infra:
              - 'infra/**'
            backend:
              - 'backend/**'

  # Deploy certificates separately - only when infra changed
  deploy-certificates:
    name: Deploy CloudFront Certificates (us-east-1)
    needs: detect-changes
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.infra == 'true'
    outputs:
      frontend-cert-arn: ${{ steps.wait-certs.outputs.frontend-cert-arn }}
      assets-cert-arn: ${{ steps.wait-certs.outputs.assets-cert-arn }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ACTIONS_ROLE_GITHUB }}
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: us-east-1

      - name: Setup environment
        uses: ./.github/actions/setup-infra-env
        with:
          aws-region: us-east-1
          domain-name: ${{ secrets.DOMAIN_NAME }}
          hosted-zone-id: ${{ secrets.HOSTED_ZONE_ID }}
          aws-account-id: ${{ secrets.AWS_ACCOUNT_ID }}

      - name: Deploy certificates stack
        working-directory: infra
        run: npm run deploy:certificates

      - name: Wait for ACM certificate validation
        id: wait-certs
        run: |
          set -euo pipefail

          FRONTEND_CERT_ARN=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}-certificates-stack \
            --region us-east-1 \
            --query "Stacks[0].Outputs[?OutputKey=='FrontendCertificateArn'].OutputValue" \
            --output text)

          ASSETS_CERT_ARN=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}-certificates-stack \
            --region us-east-1 \
            --query "Stacks[0].Outputs[?OutputKey=='AssetsCertificateArn'].OutputValue" \
            --output text)

          echo "Frontend cert ARN: $FRONTEND_CERT_ARN"
          echo "Assets cert ARN: $ASSETS_CERT_ARN"

          # Poll for certificate issuance (max 30 attempts × 10 seconds = 5 minutes)
          for i in $(seq 1 30); do
            status=$(aws acm describe-certificate \
              --certificate-arn "$FRONTEND_CERT_ARN" \
              --region us-east-1 \
              --query 'Certificate.Status' \
              --output text 2>/dev/null || echo "PENDING")
            
            echo "Certificate status: $status (attempt $i/30)"
            
            if [ "$status" = "ISSUED" ]; then
              echo "✅ Certificates are ISSUED"
              break
            fi
            
            if [ $i -lt 30 ]; then
              sleep 10
            fi
          done

          if [ "$status" != "ISSUED" ]; then
            echo "❌ Certificates not issued after 5 minutes"
            exit 1
          fi

          {
            echo "frontend-cert-arn=$FRONTEND_CERT_ARN"
            echo "assets-cert-arn=$ASSETS_CERT_ARN"
          } >> $GITHUB_OUTPUT

  deploy-infra:
    name: Deploy Infrastructure (ca-central-1)
    needs: [detect-changes, deploy-certificates]
    runs-on: ubuntu-latest
    if: always() && (needs.detect-changes.outputs.infra == 'true' || needs.detect-changes.outputs.backend == 'true')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ACTIONS_ROLE_GITHUB }}
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup environment
        uses: ./.github/actions/setup-infra-env
        with:
          domain-name: ${{ secrets.DOMAIN_NAME }}
          hosted-zone-id: ${{ secrets.HOSTED_ZONE_ID }}
          aws-account-id: ${{ secrets.AWS_ACCOUNT_ID }}

      - name: Deploy application stack
        working-directory: infra
        env:
          FRONTEND_CERTIFICATE_ARN: ${{ needs.deploy-certificates.outputs.frontend-cert-arn || '' }}
          ASSETS_CERTIFICATE_ARN: ${{ needs.deploy-certificates.outputs.assets-cert-arn || '' }}
        run: npm run deploy:app

  deploy-frontend-only:
    name: Build & Deploy Frontend
    needs: detect-changes
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.frontend == 'true' && needs.detect-changes.outputs.infra == 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ACTIONS_ROLE_GITHUB }}
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup environment
        uses: ./.github/actions/setup-infra-env
        with:
          domain-name: ${{ secrets.DOMAIN_NAME }}
          hosted-zone-id: ${{ secrets.HOSTED_ZONE_ID }}
          aws-account-id: ${{ secrets.AWS_ACCOUNT_ID }}

      - name: Get Cognito outputs from CloudFormation
        id: cognito
        run: |
          set -euo pipefail

          COGNITO_USER_POOL_ID=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}-stack \
            --region ${{ env.AWS_REGION }} \
            --query "Stacks[0].Outputs[?OutputKey=='CognitoUserPoolId'].OutputValue" \
            --output text 2>/dev/null || true)

          COGNITO_CLIENT_ID=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}-stack \
            --region ${{ env.AWS_REGION }} \
            --query "Stacks[0].Outputs[?OutputKey=='CognitoClientId'].OutputValue" \
            --output text 2>/dev/null || true)

          echo "cognito-user-pool-id=$COGNITO_USER_POOL_ID" >> $GITHUB_OUTPUT
          echo "cognito-client-id=$COGNITO_CLIENT_ID" >> $GITHUB_OUTPUT

      - name: Run inject script to write `frontend/.env`
        working-directory: infra
        run: npx ts-node scripts/inject-frontend-env.ts

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Get frontend bucket name
        id: bucket
        run: |
          FRONTEND_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}-stack \
            --region ${{ env.AWS_REGION }} \
            --query "Stacks[0].Outputs[?OutputKey=='FrontendBucketName'].OutputValue" \
            --output text)
          echo "name=$FRONTEND_BUCKET" >> $GITHUB_OUTPUT

      - name: Sync to S3
        run: |
          aws s3 sync frontend/dist/ "s3://${{ steps.bucket.outputs.name }}" \
            --delete \
            --region ${{ env.AWS_REGION }}

      - name: Invalidate CloudFront
        run: |
          CLOUDFRONT_ID=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}-stack \
            --region ${{ env.AWS_REGION }} \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue" \
            --output text)
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_ID" \
            --paths "/*"

  deploy-frontend-after-infra:
    name: Build & Deploy Frontend (after infra update)
    needs: [detect-changes, deploy-infra]
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.frontend == 'true' && (needs.detect-changes.outputs.infra == 'true' || needs.detect-changes.outputs.backend == 'true')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ACTIONS_ROLE_GITHUB }}
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup environment
        uses: ./.github/actions/setup-infra-env
        with:
          domain-name: ${{ secrets.DOMAIN_NAME }}
          hosted-zone-id: ${{ secrets.HOSTED_ZONE_ID }}
          aws-account-id: ${{ secrets.AWS_ACCOUNT_ID }}

      - name: Run inject script to write `frontend/.env`
        working-directory: infra
        run: npx ts-node scripts/inject-frontend-env.ts

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Get frontend bucket name
        id: bucket
        run: |
          FRONTEND_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}-stack \
            --region ${{ env.AWS_REGION }} \
            --query "Stacks[0].Outputs[?OutputKey=='FrontendBucketName'].OutputValue" \
            --output text)
          echo "name=$FRONTEND_BUCKET" >> $GITHUB_OUTPUT

      - name: Sync to S3
        run: |
          aws s3 sync frontend/dist/ "s3://${{ steps.bucket.outputs.name }}" \
            --delete \
            --region ${{ env.AWS_REGION }}

      - name: Invalidate CloudFront
        run: |
          CLOUDFRONT_ID=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}-stack \
            --region ${{ env.AWS_REGION }} \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue" \
            --output text)
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_ID" \
            --paths "/*"
