name: Setup Environment

description: 'Setup infra environment configuration'

inputs:
  aws-region:
    description: 'AWS Region'
    required: false
    default: 'ca-central-1'
  project-name:
    description: 'Project name'
    required: false
    default: 'hqmemes'
  environment:
    description: 'Environment (prod, staging, etc)'
    required: false
    default: 'prod'
  domain-name:
    required: true
  hosted-zone-id:
    required: true
  aws-account-id:
    required: true

runs:
  using: 'composite'
  steps:
    - name: Create `infra/.env` from secrets
      run: |
        set -euo pipefail
        cat > infra/.env <<'EOF'
        AWS_REGION=${{ inputs.aws-region }}
        AWS_ACCOUNT_ID=${{ inputs.aws-account-id }}
        PROJECT_NAME=${{ inputs.project-name }}
        ENVIRONMENT=${{ inputs.environment }}

        DOMAIN_NAME=${{ inputs.domain-name }}
        HOSTED_ZONE_ID=${{ inputs.hosted-zone-id }}

        FRONTEND_DOMAIN=${{ inputs.project-name }}.${{ inputs.domain-name }}
        ASSETS_DOMAIN=assets-${{ inputs.project-name }}.${{ inputs.domain-name }}
        API_DOMAIN=api-${{ inputs.project-name }}.${{ inputs.domain-name }}

        VITE_APP_NAME=HQMemes
        VITE_MAX_UPLOAD_SIZE=10485760
        VITE_MAX_FILES_PER_UPLOAD=10
        VITE_POLLING_INTERVAL=5000
        EOF
      shell: bash

    - name: Install infra deps and build
      working-directory: infra
      run: |
        npm ci
        npm run build
      shell: bash
